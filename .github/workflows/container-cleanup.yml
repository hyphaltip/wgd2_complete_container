name: Container Retention Policy

on:
  schedule:
    - cron: "0 3 * * 1"  # Every Monday at 03:00 UTC
  workflow_dispatch:

permissions:
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete untagged images older than 2 weeks
        uses: snok/container-retention-policy@v3.1.0
        with:
          account: hyphaltip
          account-type: user
          image-names: container_wgd2_complete
          untagged-only: true
          cut-off: 2 weeks ago UTC
          token: ${{ secrets.GITHUB_TOKEN }}
